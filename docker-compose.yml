services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: regula
      POSTGRES_USER: regula
      POSTGRES_PASSWORD: regula
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regula"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "11435:11435"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # In-stack endpoints: the backend container talks to its compose
      # siblings, so these stay pinned to the service names.
      DATABASE_URL: postgresql://regula:regula@postgres:5432/regula
      OLLAMA_API_URL: http://ollama:11434
      # Provider configuration (ADR-0009), forwarded from the operator's
      # environment or the root .env file (see .env.example). The :- defaults
      # mirror the backend's built-in defaults; the key defaults to an empty
      # string, which the backend reads as "no key configured".
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-upstage/solar-pro4}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepinfra}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hf.co/nomic-ai/nomic-embed-text-v1.5-GGUF:F16}
      REGULA_MODE: ${REGULA_MODE:-demo}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
